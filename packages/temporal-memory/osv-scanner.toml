# These are not vulnerability clearances. The deterministic SBOM contains the complete locked Cargo
# inventory shipped by @astrale-os/surrealdb-wasm, but its source inventory does not provide the
# intra-Cargo relationships needed to prove whether a package or affected function reaches the WASM
# artifact. Publication remains blocked on refreshing that fork and reviewing runtime reachability.
# Every exception is deliberately short-lived: OSV Scanner fails closed after 2026-08-23 unless the
# review is renewed with current evidence. Aliases of an ignored advisory are ignored by OSV too.

